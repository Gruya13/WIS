# ==============================================================================
# Windows Installation Assistant (WIS) - Primer konfiguracije
# ==============================================================================
# Preimenujte ovaj fajl u Wifi-Servis.ini i unesite stvarne parametre mreze.
# Fajl Wifi-Servis.ini je u .gitignore kako lozinke nikada ne bi usle u Git!
# Tokom Faze 6 (Finalizacija), Wifi-Servis.ini i privremeni WLAN profili se
# automatski i trajno brisu sa klijentskog racunara pre predaje korisniku.
# ==============================================================================

[WiFi]
SSID=YOUR_SERVICE_WIFI_SSID
Password=CHANGE_ME

[WindowsUpdate]
# Rezim rada: All (instalira i kesira drajvere + sve kumulativne i sistemske zakrpe), SkipCumulative ili DriversOnly
Mode=DriversOnly

[ServisHub]
Enabled=1
# Opciono: eksplicitni URL centralnog ServiceHub servera (ako je prazno, koristi se UDP 8888 Auto-Discovery)
Url=http://192.168.170.254:8080
# Opcioni klijentski token za upload zakrpi i model-pack drajvera (X-ServisHub-Client-Token)
ClientToken=

[ServisNas]
Enabled=1
NasHost=192.168.170.254
ShareName=Servis
ProgramiShare=Programi
UpdatesSubfolder=Updates\Win11
# Preporuka: koristiti poseban read-only servisni nalog za Programi/Updates (odvojen od NAS admin naloga)
Username=wis_service_ro
Password=CHANGE_ME
PreInstallDrivers=1
DriversSubDir=Drivers\Harvested\Models
HarvestMode=All

[Printer]
# Star TSP700II (USB, 80 mm) za nalepnicu sa specifikacijom (WIS-TASK-188).
# UI cita ovu sekciju pri startu i drzi je u memoriji (ini se brise u Fazi 6).
# Dugme "Stampaj nalepnicu" pojavljuje se tek kada servis zavrsi.
Enabled=1
# Transport: Usb (direktno na USB, bez drajvera) | Queue (Windows red stampe) | Network (RAW TCP)
Transport=Usb
# Emulation: StarLine (fabricki rezim TSP700II) | EscPos
Emulation=StarLine
# Opciono za Transport=Queue: tacno ime instaliranog stampaca u Windows-u
PrinterName=
# Samo za Transport=Network
Host=
Port=9100
Copies=1
# Sirina u tackama: 576 = 72 mm stampe na 80 mm papiru @ 203 dpi
WidthDots=576
ShopName=IG-Systems

; [Licensing]
; Opciono podesavanje aktivacije Microsoft Office-a i Windows-a u Fazi 4 (odkomentarisite sekciju po potrebi).
; Podrzani rezimi (OfficeActivationMode): Auto (podrazumevano), Kms, Mak, ExternalHook, Skip
;   Skip = preskace gresku Office aktivacije (npr. kada kupac donosi svoju maloprodajnu O365 pretplatu)
; OfficeActivationMode=Auto
; Hostname ili IP adresa lokalnog KMS servera u mrezi (opciono)
; OfficeKmsHost=
; TCP port lokalnog KMS servera (podrazumevano 1688)
; OfficeKmsPort=1688
; Legalni MAK/Volume 25-znakova kljuc (STROGO POVERLJIVO - ne unositi u Git; trajno se brise u Fazi 6)
; OfficeProductKey=
; Podrzani rezimi (WindowsActivationMode): Auto (podrazumevano), Kms, Mak, ExternalHook, Skip
;   Skip = preskace gresku Windows aktivacije
; WindowsActivationMode=Auto
; Hostname ili IP adresa lokalnog Windows KMS servera u mrezi (opciono)
; WindowsKmsHost=
; TCP port lokalnog Windows KMS servera (podrazumevano 1688)
; WindowsKmsPort=1688
; Legalni MAK/Volume/OEM 25-znakova kljuc za Windows (STROGO POVERLJIVO - ne unositi u Git; trajno se brise u Fazi 6)
; WindowsProductKey=
